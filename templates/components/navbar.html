<header class="topbar">
  <button id="menu-toggle" class="icon-button mobile-menu" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">
    <span aria-hidden="true">☰</span>
  </button>
  <nav aria-label="Navegación principal"><a href="{% url 'home' %}" {% if request.path == '/' %}aria-current="page"{% endif %}>Curso</a><a href="{% url 'course-progress' %}" {% if request.path == '/avance/' %}aria-current="page"{% endif %}>Mi avance</a></nav>
  <form action="{% url 'search' %}" method="get" class="search-box" role="search">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
    <input name="q" type="search" aria-label="Buscar en el curso" placeholder="Buscar un tema del curso…" maxlength="80" value="{{ request.GET.q }}">
  </form>
</header>
