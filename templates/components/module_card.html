<article class="module-card {% if number == 1 %}featured{% endif %}"><div class="card-top"><span class="module-icon"><i class="bi bi-{{ icon }}"></i></span><span class="status {% if number == 1 %}status-success{% endif %}">{% if number == 1 %}En curso{% else %}Próximamente{% endif %}</span></div><p class="eyebrow">MÓDULO {{ number|stringformat:'02d' }}</p><h3>{{ title }}</h3><p>{{ description }}</p>{% if number == 1 %}<div class="progress-track"><span style="width:{{ module_progress }}%"></span></div><a class="btn btn-primary w-100" href="{% url 'nonlinear:landing' %}">Continuar <i class="bi bi-arrow-right"></i></a>{% else %}<div class="coming-soon"><i class="bi bi-lock"></i> Disponible próximamente</div>{% endif %}</article>
